[project]
name = "conversa-transcription-service"
version = "0.1.0"
description = "Real-time speech segmentation and transcription service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "silero-vad>=5.1.0",
    "faster-whisper>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
