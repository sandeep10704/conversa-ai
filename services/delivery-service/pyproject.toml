[project]
name = "conversa-delivery-service"
version = "0.1.0"
description = "Real-time WebSocket transcript delivery service with session isolation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiokafka>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
