services:

  postgres:
    image: postgres:16-alpine
    container_name: conversa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conversa}
      POSTGRES_USER: ${POSTGRES_USER:-conversa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conversa_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conversa_user} -d ${POSTGRES_DB:-conversa}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - conversa-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: conversa-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - conversa-network

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: conversa-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: [ "/bin/bash", "/init-topics.sh" ]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - conversa-network

  agent-api:
    build:
      context: ../services/agent-server
      dockerfile: Dockerfile
    container_name: conversa-agent-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-conversa_user}:${POSTGRES_PASSWORD:-conversa_password}@postgres:5432/${POSTGRES_DB:-conversa}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - conversa-network

  outbox-publisher:
    build:
      context: ../services/agent-server
      dockerfile: Dockerfile
    container_name: conversa-outbox-publisher
    restart: unless-stopped
    command: ["python", "-m", "app.publisher.main"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-conversa_user}:${POSTGRES_PASSWORD:-conversa_password}@postgres:5432/${POSTGRES_DB:-conversa}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - conversa-network

  consumer-worker:
    build:
      context: ../services/agent-server
      dockerfile: Dockerfile
    container_name: conversa-consumer-worker
    restart: unless-stopped
    command: ["python", "-m", "app.consumer.main"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-conversa_user}:${POSTGRES_PASSWORD:-conversa_password}@postgres:5432/${POSTGRES_DB:-conversa}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      AGENT_AUTO_RUN: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - conversa-network

  trigger-controller:
    build:
      context: ../services/agent-server
      dockerfile: Dockerfile
    container_name: conversa-trigger-controller
    restart: unless-stopped
    command: ["python", "-m", "app.orchestration.main"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-conversa_user}:${POSTGRES_PASSWORD:-conversa_password}@postgres:5432/${POSTGRES_DB:-conversa}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      AGENT_AUTO_RUN: ${AGENT_AUTO_RUN:-false}
      AGENT_TRIGGER_MIN_NEW_MESSAGES: ${AGENT_TRIGGER_MIN_NEW_MESSAGES:-3}
      AGENT_TRIGGER_DEBOUNCE_MS: ${AGENT_TRIGGER_DEBOUNCE_MS:-3000}
      AGENT_SESSION_COOLDOWN_SECONDS: ${AGENT_SESSION_COOLDOWN_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - conversa-network

  agent-worker:
    build:
      context: ../services/agent-server
      dockerfile: Dockerfile
    container_name: conversa-agent-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-conversa_user}:${POSTGRES_PASSWORD:-conversa_password}@postgres:5432/${POSTGRES_DB:-conversa}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      MOCK_LLM: ${MOCK_LLM:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - conversa-network


  delivery-service:
    build:
      context: ../services/delivery-service
      dockerfile: Dockerfile
    container_name: conversa-delivery-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      ENABLE_KAFKA_DELIVERY: ${ENABLE_KAFKA_DELIVERY:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - conversa-network

  transcription-service:
    build:
      context: ../services/transcription-service
      dockerfile: Dockerfile
    container_name: conversa-transcription-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      AGENT_SERVER_URL: http://agent-api:8001
      DELIVERY_SERVICE_URL: http://delivery-service:8003
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-tiny.en}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      VAD_MOCK: ${VAD_MOCK:-false}
      WHISPER_MOCK: ${WHISPER_MOCK:-false}
    depends_on:
      - delivery-service
      - agent-api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - conversa-network

  audio-gateway:
    build:
      context: ../services/audio-gateway
      dockerfile: Dockerfile
    container_name: conversa-audio-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      TRANSCRIPTION_SERVICE_WS_URL: ws://transcription-service:8004/ws/transcribe
    depends_on:
      - transcription-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - conversa-network

volumes:
  postgres_data:
  kafka_data:

networks:
  conversa-network:
    driver: bridge
